<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:fragment="titulo">
        <title>Subir Variante - Marvel Snap Mazos, Cartas y Variantes</title>
    </th:block>
    <th:block th:fragment="css">
        <link rel="stylesheet" type="text/css" th:href="@{/styles/upload_variante.css}">
    </th:block>
    <script th:fragment="js" th:remove="tag"></script>
</head>
<body>
    <main th:fragment="contenido" class="contenido">
        <section class="titulo">
            <p>Sube tu propia Variante a la plataforma</p>
        </section>
        <section>
            <form th:action="@{/variantes/upload}" th:object="${varianteDto}" method="post" enctype="multipart/form-data" class="formulario col">
                <div class="col">
                    <label for="nombre">Nombre:</label>
                    <input type="text" th:field="*{nombre}" id="nombre" name="nombre" class="campo" minlength="3" maxlength="50" required>
                    <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error"></span>
                </div>
                <div class="col">
                    <label for="descripcion">Descripción (Opcional):</label>
                    <textarea id="descripcion" name="descripcion" rows="6" cols="64" placeholder="Introduce una descripción de tu mazo"></textarea>
                </div>
                <div class="col">
                    <label for="imagen">Variante:</label>
                    <input type="file" th:field="*{imagen}" id="imagen" name="imagen" accept="image/png, image/jpeg, image/jpg, image/webp" class="campo foto" required>
                    <span th:if="${#fields.hasErrors('imagen')}" th:errors="*{imagen}" class="error"></span>
                    <span th:if="${errorImg}" th:utext="${errorImg}" class="error"></span>
                </div>
                <div class="col">
                    <label for="personaje">Personaje:</label>
                    <input type="text" th:field="*{personaje}" id="personaje" name="personaje" class="campo" minlength="3" maxlength="50" required>
                    <span th:if="${#fields.hasErrors('personaje')}" th:errors="*{personaje}" class="error"></span>
                    <span th:if="${errorPersonaje}" th:utext="${errorPersonaje}" class="error"></span>
                </div>
                <div style="width: 100%;">
                    <input type="submit" id="btn_registro" name="btn_registro" class="campo boton" value="Subir">
                </div>
            </form>
        </section>
    </main>
</body>
</html>
