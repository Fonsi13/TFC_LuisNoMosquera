<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:fragment="titulo">
        <title th:text="${carta.nombre} + ' - Snap Labs'">Detalles - Snap Labs</title>
    </th:block>
    <th:block th:fragment="css">
        <link rel="stylesheet" type="text/css" th:href="@{/styles/carta.css}">
    </th:block>
    <script th:fragment="js" th:remove="tag"></script>
</head>
<body>
    <main th:fragment="contenido">
        <section>
            <h1 th:text="${carta.nombre}" class="titulo"></h1>
        </section>
        <section class="gridDetalles">
            <div class="img-base">
                <img th:src="${carta.imagen}" th:alt="'Variante base de la carta ' + ${carta.nombre}">
            </div>
            <div class="detalles">
                <div id="div-descripcion" class="info">
                    <h2 class="subtitulo">Descripción</h2>
                    <hr class="linea">
                    <p th:text="${carta.descripcion}" class="texto"></p>
                </div>
                <div id="div-serie" class="info">
                    <h2 class="subtitulo">Serie</h2>
                    <hr class="linea">
                    <a th:href="@{/cartas/{serie}(serie=${carta.serieClave})}" th:text="${carta.serieNombre}" class="texto" th:aria-label="'Ver todas las cartas de la serie ' + ${carta.serieNombre}"></a>
                </div>
                <div id="div-stats" class="info">
                    <h2 class="subtitulo">Estadísticas</h2>
                    <hr class="linea">
                    <p th:text="'Coste: ' + ${carta.coste}" class="texto"></p>
                    <p th:text="'Poder: ' + ${carta.poder}" class="texto"></p>
                </div>
                <div id="div-disponible" class="info">
                    <h2 class="subtitulo">Disponibilidad</h2>
                    <hr class="linea">
                    <p th:if="${carta.publicado}" class="texto">Publicada</p>
                    <p th:unless="${carta.publicado}" class="texto">No publicada</p>
                </div>
                <div id="div-artistas" class="info">
                    <h2 class="subtitulo">Artistas</h2>
                    <hr class="linea">
                    <div th:each="artista : ${carta.variantes[0].artistas}">
                        <p th:text="${artista.tipo} + ': ' + ${artista.nombre}" class="texto"></p>
                    </div>
                </div>
            </div>
        </section>
        <section class="variantes">
            <h2 class="subtitulo" style="text-align: center">Variantes</h2>
            <div class="gridVariantes">
                <div th:each="variante: ${carta.variantes}" class="variante">
                    <div>
                        <img th:if="${variante.nombre == 'null'}" th:src="${variante.imagen}" th:alt="'Variante base'" class="imagen">
                        <img th:unless="${variante.nombre == 'null'}" th:src="${variante.imagen}" th:alt="'Variante ' + ${variante.nombre}" class="imagen">
                    </div>
                    <div class="info-variante">
                        <p th:if="${variante.nombre == 'null'}" th:text="'Variante: Carta Base'" class="texto"></p>
                        <p th:unless="${variante.nombre == 'null'}" th:text="'Variante: ' + ${variante.nombre}" class="texto"></p>
                        <p th:if="${variante.rareza != 'Unknown'}" th:text="'Rareza: ' + ${variante.rareza}" class="texto"></p>
                        <div th:each="artista : ${variante.artistas}">
                            <p th:text="${artista.tipo} + ': ' + ${artista.nombre}" class="texto"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
