<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:fragment="titulo">
        <title>Mazos Meta - Snap Labs</title>
    </th:block>
    <th:block th:fragment="css">
        <link rel="stylesheet" type="text/css" th:href="@{/styles/meta.css}">
    </th:block>
    <script th:fragment="js" th:src="@{/js/meta.js}" type="module" defer></script>
</head>
<body>
    <main th:fragment="contenido" class="contenido">
        <section>
            <h1 class="titulo">Mazos Meta - Los mejores mazos para el meta actual</h1>
        </section>
        <section class="gridMazos">
            <div th:each="mazo : ${listaMazos}" class="mazo">
                <div class="grid-meta">
                    <p th:text="${mazo.nombre}" class="nombre"></p>
                    <button type="button" onclick="copiarCodigo(event)" th:value="${mazo.codigo}" class="boton subtitulo" th:aria-label="'Copiar código del mazo: ' + ${mazo.nombre}">Copiar</button>
                    <p class="texto negrita vict">Porcentaje de victorias: <span th:text="${#numbers.formatDecimal(mazo.pctVictorias, 1, 2)} + '%'" class="texto"></span></p>
                    <p class="texto negrita cube">Promedio de cubos: <span th:text="${#numbers.formatDecimal(mazo.mediaCubos, 1, 2)}" class="texto"></span></p>
                </div>
                <hr class="linea">
                <div class="gridCartas">
                    <div th:each="carta : ${mazo.cartas}" th:data-src="${carta.imagen}" th:data-desc="${carta.descripcion}">
                        <img th:src="${carta.imagen}" th:alt="${carta.nombre}" class="imagen">
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
